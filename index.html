<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />

  <!-- PWA: manifest se inyecta automáticamente por vite-plugin-pwa -->
  <meta name="theme-color" content="#57FF9A" />
  <meta name="color-scheme" content="dark" />

  <!-- iOS Safari: comportamiento de standalone app -->
  <!-- IMPORTANTE: "default" o "black" empujan el contenido abajo del status bar.
       "black-translucent" hace que el contenido se renderice DEBAJO del notch (bug clásico). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="OMM ERP" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Microsoft tile (Windows) -->
  <meta name="msapplication-TileColor" content="#57FF9A" />
  <meta name="msapplication-tap-highlight" content="no" />

  <title>OMM ERP</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
